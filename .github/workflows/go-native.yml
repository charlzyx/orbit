name: Go native migration

on:
  push:
    branches: ["redesign/mygo-rpc"]
    paths: ["**/*.go", "**/*.go.txt", "**/go.mod", "**/go.sum", "scripts/go-native*", "scripts/ci/**", "scripts/capture-native-reference.sh", "scripts/usage-native/**", "testdata/usage-native/**", "scripts/chat-native/**", "testdata/chat-native/**", "scripts/workbench-native/**", "testdata/workbench-native/**", "third_party/mygo-composer/**", "third_party/mygo-selection/**", "assets/**", ".github/workflows/go-native.yml"]
  pull_request:
    paths: ["**/*.go", "**/*.go.txt", "**/go.mod", "**/go.sum", "scripts/go-native*", "scripts/ci/**", "scripts/capture-native-reference.sh", "scripts/usage-native/**", "testdata/usage-native/**", "scripts/chat-native/**", "testdata/chat-native/**", "scripts/workbench-native/**", "testdata/workbench-native/**", "third_party/mygo-composer/**", "third_party/mygo-selection/**", "assets/**", ".github/workflows/go-native.yml"]
  workflow_dispatch:
    inputs:
      capture_chat_stage1:
        description: 'Capture two static Chat states; Context remains BLOCKED'
        type: boolean
        default: false

permissions:
  contents: read

jobs:
  proc-guard-regression:
    runs-on: ubuntu-24.04
    timeout-minutes: 3
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      - name: Check dependency phase logging offline
        run: python3 -m unittest discover -s scripts/ci -p 'test_install_native_deps.py' -v
      - name: Require real threaded child-process ownership regression
        env:
          ORBIT_REQUIRE_PROC_CHILDREN: "1"
        run: python3 -m unittest discover -s scripts/chat-native -p 'test_thread_children.py' -v

  receipt-guard-regression:
    needs: proc-guard-regression
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: '22.23.4'
      - name: Materialize pinned reference patch sources only
        run: |
          git fetch --depth=1 origin 299a32bc87fe3d4851bdb902d9c03dcf9bf99cac
          git worktree add --detach /tmp/orbit-receipt-reference 299a32bc87fe3d4851bdb902d9c03dcf9bf99cac
      - name: Install public pinned Pi and independent fixed-integrity vendor input
        run: |
          npm install --prefix /tmp/orbit-receipt-pi-runtime @earendil-works/pi-coding-agent@1.4.0
          curl --fail --silent --show-error --location --proto '=https' --max-time 60 --max-filesize 67108864 'https://registry.npmjs.org/@earendil-works/pi-coding-agent/-/pi-coding-agent-1.4.0.tgz' -o /tmp/orbit-receipt-vendor.tgz
      - name: Require real Node22 Pi receipts and worker-thread ancestry without skips
        env:
          ORBIT_REQUIRE_PROC_CHILDREN: "1"
          ORBIT_RECEIPT_PI_RUNTIME: /tmp/orbit-receipt-pi-runtime
          ORBIT_RECEIPT_VENDOR_ARCHIVE: /tmp/orbit-receipt-vendor.tgz
          ORBIT_RECEIPT_RUST_SOURCE: /tmp/orbit-receipt-reference
        run: |
          set -o pipefail
          export ORBIT_RECEIPT_NODE="$(command -v node)"
          mkdir -p capture/receipt-regression
          python3 scripts/chat-native/run_receipt_regression.py 2>&1 | tee capture/receipt-regression/proof.log
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        if: always()
        with:
          name: chat-receipt-metadata-regression
          path: capture/receipt-regression/

  test:
    runs-on: ubuntu-24.04
    env:
      ORBIT_REQUIRE_COMPOSER_PATCH: "1"
      ORBIT_REQUIRE_SELECTION_PATCH: "1"
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      - uses: actions/setup-go@924ae3a1cded613372ab5595356fb5720e22ba16
        with:
          go-version: '1.27.3'
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: '22.23.4'
      - name: Native text raster dependencies
        run: sudo apt-get update && sudo apt-get install -y libpango-1.0-0 libcairo2 libfontconfig1
      - name: Install pinned Pi for credential-free protocol integration
        run: npm install --prefix /tmp/orbit-pi-runtime @earendil-works/pi-coding-agent@1.4.0
      - run: scripts/go-native.sh vet ./...
      - # Total suite budget: added mounted regressions exceed the old 10m package limit.
        # Serial package execution reduces contention; individual assertions/timeouts are unchanged.
        run: scripts/go-native.sh test -race -p 1 -timeout 20m ./...
        env:
          ORBIT_PI_INTEGRATION_BIN: /tmp/orbit-pi-runtime/node_modules/.bin/pi
          ORBIT_TERMINAL_TEST: "1"
      - name: Composer and selection compatibility toolkit regressions
        run: scripts/go-native.sh test -race github.com/egoist/mygo/ui -run "^TestOrbit(Composer|Selection)" -count=1
      - name: Required committed menu-hit and default-menu regressions
        run: |
          python3 - <<'PYMENU'
          import collections,json,os,pathlib,re,subprocess
          names = ['TestAccelerator', 'TestContextMenu', 'TestContextMenuFromTheKeyboard', 'TestInnermostContextMenu', 'TestMenuAndContextMenuOfOneElement', 'TestMenuButton', 'TestMenuButtonAccessibility', 'TestTextInputContextMenu', 'TestTextMenuHitActualBlockLimit', 'TestTextMenuHitBoundedNearestAndStableTie', 'TestTextMenuHitClipDisabledOcclusionAndList', 'TestTextMenuHitCollectPanicReleasesEvent', 'TestTextMenuHitDefaultEmptyAndKeyboard', 'TestTextMenuHitFinalPassRegistrationOnly', 'TestTextMenuHitFinitePublicTransformsCanOverflowAtCommit', 'TestTextMenuHitInvalidGeometryBeforeHitChain', 'TestTextMenuHitOpeningSnapshotAndCancel', 'TestTextMenuHitOwnerAndWindow', 'TestTextMenuHitRejectsInvalidDerivedDistance', 'TestTextMenuHitStrictManhattanAndFinite', 'TestTextMenuHitTargetLimitAndPassPruning', 'TestTextMenuHitWindowsReleaseOrigin']
          log = pathlib.Path(os.environ['RUNNER_TEMP'])/'orbit-menu-hit-required.jsonl'
          with log.open('w') as f:
              result = subprocess.run(['scripts/go-native.sh','test','-race','-json','github.com/egoist/mygo/ui','-run','^('+'|'.join(re.escape(n) for n in names)+')$','-count=1'],stdout=f,stderr=subprocess.STDOUT)
          rows = [json.loads(s) for s in log.read_text().splitlines() if s.startswith('{')]
          counts = collections.Counter((x.get('Test'),x.get('Action')) for x in rows)
          valid = result.returncode == 0 and len(names) == 22 and all(counts[n,'run'] == counts[n,'pass'] == 1 for n in names) and not any(x.get('Action') in ('fail','skip') for x in rows)
          if not valid:
              print(log.read_text())
              raise SystemExit('Required exact menu-hit/default-menu tests did not all run and pass without skip')
          print('MENU_HIT_REQUIRED_22_TOP_LEVEL_ZERO_SKIP_VERIFIED')
          print(json.dumps({n:{'run':counts[n,'run'],'pass':counts[n,'pass']} for n in names},sort_keys=True))
          PYMENU
      - name: Verify canonical wrapper manifest boundaries
        run: python3 scripts/test-go-native-overlay.py
      - name: Source workbench and Usage fixture/capture safety regressions
        run: |
          python3 -m unittest discover -s scripts/workbench-native -p 'test_*.py'
          python3 -m unittest discover -s scripts/usage-native -p 'test_*.py'
          python3 -m unittest discover -s scripts/chat-native -p 'test_*.py'
        env:
          ORBIT_PI_INTEGRATION_BIN: /tmp/orbit-pi-runtime/node_modules/.bin/pi
      - name: Terminal compatibility module regressions
        run: |
          if [ -f third_party/mygo-terminal/go.mod ]; then
            scripts/go-native.sh -C third_party/mygo-terminal test -race ./...
          fi
      - name: Reproducible CPU captures (not desktop integration)
        run: ORBIT_CAPTURE_DIR="$PWD/capture/native-cpu" scripts/go-native.sh test ./internal/ui -run '^TestNativeCapture$' -count=1
      - name: Typed transcript and retained-selection CPU fixtures (not matched pixels)
        run: ORBIT_TRANSCRIPT_CAPTURE_DIR="$PWD/capture/transcript-cpu" scripts/go-native.sh test ./internal/transcriptui -run '^TestNative(TranscriptCapture|RetainedSelectionCapture)$' -count=1
      - name: No-cgo cross compilation
        run: |
          for target in linux/amd64 linux/arm64 darwin/arm64 windows/amd64 windows/arm64; do
            GOOS=${target%/*} GOARCH=${target#*/} CGO_ENABLED=0 scripts/go-native.sh build -o "/tmp/orbit-cross-${target%/*}-${target#*/}" ./cmd/orbit
          done
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        if: always()
        with:
          name: native-cpu-captures
          path: capture/

  reference-desktop:
    needs: [proc-guard-regression, receipt-guard-regression]
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: '22.23.4'
      - name: Reference renderer and isolated display dependencies
        timeout-minutes: 5
        run: bash scripts/ci/install-native-deps.sh reference
      - uses: dtolnay/rust-toolchain@b725eda525362e7cf34af9a7243cac1e3f01a7ec
        with:
          toolchain: '1.94.0'
      - name: Materialize pinned original source
        run: |
          git fetch --depth=1 origin 299a32bc87fe3d4851bdb902d9c03dcf9bf99cac
          git worktree add --detach /tmp/orbit-reference 299a32bc87fe3d4851bdb902d9c03dcf9bf99cac
      - name: Verify verbatim pinned Rust ragged-table parser fixture
        run: python3 scripts/markdown-parity/check-rust-table.py /tmp/orbit-reference
      - name: Cache pinned reference build
        uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0
        with:
          workspaces: /tmp/orbit-reference -> target
          shared-key: orbit-reference-299a32b-rust-1.94
      - name: Build pinned original source (reference only)
        run: cargo build --locked --manifest-path /tmp/orbit-reference/Cargo.toml -p orbit-pi
      - name: Install pinned Pi without credentials or inference
        run: npm install --prefix /tmp/orbit-pi-runtime @earendil-works/pi-coding-agent@1.4.0
      - name: Capture actual original native window
        env:
          ORBIT_CAPTURE_CHAT_STAGE1: ${{ github.event_name == 'workflow_dispatch' && inputs.capture_chat_stage1 && '1' || '0' }}
        run: ORBIT_CAPTURE_USAGE=1 ORBIT_CAPTURE_WORKBENCH=1 scripts/capture-native-reference.sh /tmp/orbit-reference/target/debug/orbit-pi "$PWD/capture/reference-desktop" reference /tmp/orbit-reference
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        if: always()
        with:
          name: pinned-reference-desktop
          path: capture/

  native-desktop:
    needs: [proc-guard-regression, receipt-guard-regression]
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      - uses: actions/setup-go@924ae3a1cded613372ab5595356fb5720e22ba16
        with:
          go-version: '1.27.3'
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: '22.23.4'
      - name: Isolated native display dependencies
        timeout-minutes: 5
        run: bash scripts/ci/install-native-deps.sh go
      - name: Build native Go app and pinned Pi fixture
        run: |
          CGO_ENABLED=0 scripts/go-native.sh build -o /tmp/orbit-go-native ./cmd/orbit
          npm install --prefix /tmp/orbit-pi-runtime @earendil-works/pi-coding-agent@1.4.0
      - name: Capture real Go native desktop window
        env:
          ORBIT_CAPTURE_CHAT_STAGE1: ${{ github.event_name == 'workflow_dispatch' && inputs.capture_chat_stage1 && '1' || '0' }}
        run: ORBIT_CAPTURE_USAGE=1 ORBIT_CAPTURE_WORKBENCH=1 scripts/capture-native-reference.sh /tmp/orbit-go-native "$PWD/capture/go-desktop" go
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        if: always()
        with:
          name: go-native-desktop
          path: capture/
